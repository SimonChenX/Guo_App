name: Build Windows (unsigned)

# Standalone Windows build that does not depend on the `checks` gate in build.yml.
# Trigger manually from the Actions tab or via pushing a change to this file.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW-w64 on PATH
        run: 'echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append'
      - run: gcc --version
      - name: Build Windows package
        shell: pwsh
        run: |
          python scripts/build_windows.py ${{ matrix.arguments }} *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content build.log
            $pat = 'CMake Error|MSB3073|cannot find|fatal error|Failed to|error LNK|error C[0-9]|No such file|is missing|Error:'
            $sel = $lines | Select-String -Pattern $pat | Select-Object -First 25 | ForEach-Object { $_.Line }
            $block = if ($sel.Count) { $sel } else { $lines | Select-Object -Last 30 }
            $msg = (($block -join "`n") -replace "`r", "")
            $msg = ($msg -replace '%', '%25') -replace "`n", '%0A'
            if ($msg.Length -gt 6000) { $msg = $msg.Substring(0, 6000) }
            Write-Host "::error title=build_windows failed::$msg"
            exit 1
          }
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14