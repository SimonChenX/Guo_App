name: Build Windows (unsigned)

# Standalone Windows build that does not depend on the `checks` gate in build.yml.
# Trigger manually from the Actions tab or via pushing a change to this file.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14