name: Build Windows (unsigned)

# Standalone Windows build that does not depend on the `checks` gate in build.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'
      - 'windows/**'

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
            all_sources: 'false'
          - edition: zhenguojian
            arguments: '--all-sources'
            all_sources: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW-w64 on PATH
        run: 'echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append'
      - run: gcc --version
      - name: Build native core
        run: |
          python scripts/build_native.py --platform windows ${{ matrix.arguments }}
          if (-not (Test-Path "windows/runner/duanju_core.dll")) { Write-Host "::error title=missing core::duanju_core.dll was not produced"; exit 1 }
        shell: pwsh
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Flutter build windows (verbose on failure)
        shell: pwsh
        run: |
          flutter build windows --release --no-pub --dart-define=ALL_SOURCES=${{ matrix.all_sources }} -v *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content build.log
            $idx = ($lines | Select-String -Pattern 'CMake Error at cmake_install' | Select-Object -First 1).LineNumber
            if ($idx) {
              $end = [Math]::Min($lines.Count - 1, $idx + 10)
              $block = $lines[($idx - 1)..$end]
            } else {
              $block = $lines | Select-String -Pattern 'CMake Error|cannot find|No such file|Failed to|error LNK|error C[0-9]' | Select-Object -First 20 | ForEach-Object { $_.Line }
            }
            $msg = (($block -join "`n") -replace "`r", "")
            $msg = ($msg -replace '%', '%25') -replace "`n", '%0A'
            if ($msg.Length -gt 6000) { $msg = $msg.Substring(0, 6000) }
            Write-Host "::error title=build_windows failed::$msg"
            exit 1
          }
      - name: Package release
        run: python scripts/package_release.py --platform windows ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14